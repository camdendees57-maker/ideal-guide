name: Build VR Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -L --fail --retry 3 -o commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q commandlinetools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;28.1.13356709"

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v4.5.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.5.1.stable/
          printf "4.5.1.stable\n" > ~/.local/share/godot/export_templates/4.5.1.stable/version.txt

      - name: Install project Android build template
        run: ./godot --headless --path . --editor --install-android-build-template

      - name: Validate project
        run: ./godot --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build/android
          ./godot --headless --path . --export-debug "Android" build/android/GorillaLocomotionLab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GorillaLocomotionLab-Android
          path: build/android/GorillaLocomotionLab.apk
          if-no-files-found: error
          retention-days: 14
